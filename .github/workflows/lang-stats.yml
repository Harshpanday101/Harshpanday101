name: Update language stats

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    paths:
      - "scripts/lang_stats.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate language stats
        env:
          GH_USER: Harshpanday101
          # Optional: add a secret named LANG_STATS_TOKEN (classic PAT with "repo" scope)
          # to include private repos. Without it, only public repos are counted.
          GH_TOKEN: ${{ secrets.LANG_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_FORKS: "false"
          EXCLUDE_LANGS: "Jupyter Notebook,Makefile,CMake,Shell,Dockerfile,Batchfile"   # comma-separated, edit as you like
        run: python scripts/lang_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: update language stats"
          git push
